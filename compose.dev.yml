name: photostream-dev

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: photostream
      POSTGRES_USER: photostream
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photostream -d photostream"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - photostream-postgres:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  photostream-postgres:
