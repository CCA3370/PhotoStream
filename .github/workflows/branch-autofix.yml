name: Branch autofix

on:
  push:
    branches:
      - codex/public-gallery-ux-face-search

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/public-gallery-ux-face-search
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact source fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          source_roots = [Path('apps'), Path('packages')]
          for root in source_roots:
              for path in root.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx'}:
                      continue
                  text = path.read_text()
                  if 'complaintContact' not in text:
                      continue
                  lines = text.splitlines(keepends=True)
                  updated = ''.join(line for line in lines if 'complaintContact' not in line)
                  path.write_text(updated)

          face = Path('apps/api/src/face/service.ts')
          text = face.read_text()
          text = text.replace(
              'const { album, index, sessionDigest, ipDigest } = await this.#authorizedSearchContext(options);',
              'const { album, sessionDigest, ipDigest } = await this.#authorizedSearchContext(options);',
          )
          face.write_text(text)

          panel = Path('apps/web/src/components/gallery/bib-search-panel.tsx')
          text = panel.read_text()
          text = text.replace(
              '<label className="mt-4 inline-flex cursor-pointer items-center gap-2 rounded-xl bg-primary px-4 py-2 text-sm font-medium text-primary-foreground">',
              '<label className="mt-4 inline-flex cursor-pointer items-center gap-2 rounded-xl bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" htmlFor="face-reference-file">',
          )
          text = text.replace(
              'accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif"\n                      className="sr-only"',
              'accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif"\n                      className="sr-only"\n                      id="face-reference-file"',
          )
          panel.write_text(text)
          PY

      - name: Generate database migration
        run: pnpm --filter @photostream/db db:generate

      - name: Format touched source files
        run: >-
          pnpm exec biome check --write
          apps/api/src/face/service.ts
          apps/api/src/media/service.ts
          apps/web/src/components/face/face-config-editor.tsx
          apps/web/src/components/gallery/bib-search-panel.tsx
          apps/web/src/components/gallery/photo-lightbox.tsx
          apps/web/src/components/gallery/media-grid.tsx
          apps/web/src/components/gallery/paginated-media-grid.tsx
          apps/web/src/components/gallery/photo-like-button.tsx
          apps/web/src/components/gallery/unlock-album-form.tsx
          'apps/web/src/app/(public)/g/[slug]/page.tsx'
          packages/contracts/src/index.ts
          packages/db/src/schema.ts

      - name: Verify complaint contact is gone from runtime source
        run: |
          if grep -R -n --include='*.ts' --include='*.tsx' 'complaintContact' apps packages; then
            echo 'complaintContact remains in runtime source' >&2
            exit 1
          fi

      - name: Commit fixes and remove helper workflow
        run: |
          rm .github/workflows/branch-autofix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish gallery UX cleanup and remove complaint contact'
          git push origin HEAD:codex/public-gallery-ux-face-search
