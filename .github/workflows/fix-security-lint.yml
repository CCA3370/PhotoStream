name: Fix security PR lint ordering

on:
  push:
    branches:
      - fix/security-audit-20260915

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/security-audit-20260915
      - name: Fix import order and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/routes/face.ts')
          text = path.read_text()
          old = '''import {
            requireInternalCsrf,
            requireInternalSession,
            verifyPasswordConfirmation,
          } from "../auth/http.js";
          import type { DashboardService } from "../analytics/dashboard-service.js";
          '''
          new = '''import type { DashboardService } from "../analytics/dashboard-service.js";
          import {
            requireInternalCsrf,
            requireInternalSession,
            verifyPasswordConfirmation,
          } from "../auth/http.js";
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one import block, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/fix-security-lint.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix face route import ordering"
          git push origin HEAD:fix/security-audit-20260915
