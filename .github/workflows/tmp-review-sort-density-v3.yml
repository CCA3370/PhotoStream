name: Temporary review sort and density integrator v3

on:
  push:
    branches:
      - review-workspace-efficiency

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: review-workspace-efficiency
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Integrate sorting and grid density
        run: |
          python3 - <<'PY'
          from pathlib import Path

          routes = Path('apps/api/src/routes/photos.ts')
          text = routes.read_text()
          anchor = '    classOptionId: z.string().uuid().optional(),\n    cursor: z.string().max(1_000).optional(),'
          replacement = '    classOptionId: z.string().uuid().optional(),\n    sort: z.enum(["newest", "oldest"]).default("newest"),\n    cursor: z.string().max(1_000).optional(),'
          if text.count(anchor) != 2:
              raise SystemExit(f'route sort anchors: {text.count(anchor)}')
          routes.write_text(text.replace(anchor, replacement))

          service = Path('apps/api/src/media/service.ts')
          text = service.read_text()
          start = text.index('  async listInternalMedia(')
          end = text.index('  async listAlbumUploaders(', start)
          section = text[start:end]

          anchor = '      readonly classOptionId?: string | undefined;\n      readonly cursor?: string | undefined;\n      readonly limit: number;'
          replacement = '      readonly classOptionId?: string | undefined;\n      readonly sort?: "newest" | "oldest";\n      readonly cursor?: string | undefined;\n      readonly limit: number;'
          if section.count(anchor) != 2:
              raise SystemExit(f'service option anchors: {section.count(anchor)}')
          section = section.replace(anchor, replacement)

          anchor = '        : this.#decodeInternalCursor(options.cursor, options.albumId);'
          replacement = '        : this.#decodeInternalCursor(options.cursor, options.albumId, options.sort ?? "newest");'
          if section.count(anchor) != 2:
              raise SystemExit(f'decode call anchors: {section.count(anchor)}')
          section = section.replace(anchor, replacement)

          anchor = '''      const cursorCondition = or(\n        lt(schema.media.createdAt, cursor.createdAt),\n        and(eq(schema.media.createdAt, cursor.createdAt), lt(schema.media.id, cursor.mediaId)),\n      );'''
          replacement = '''      const cursorCondition =\n        (options.sort ?? "newest") === "oldest"\n          ? or(\n              gt(schema.media.createdAt, cursor.createdAt),\n              and(eq(schema.media.createdAt, cursor.createdAt), gt(schema.media.id, cursor.mediaId)),\n            )\n          : or(\n              lt(schema.media.createdAt, cursor.createdAt),\n              and(eq(schema.media.createdAt, cursor.createdAt), lt(schema.media.id, cursor.mediaId)),\n            );'''
          if section.count(anchor) != 2:
              raise SystemExit(f'cursor condition anchors: {section.count(anchor)}')
          section = section.replace(anchor, replacement)

          anchor = '.orderBy(desc(schema.media.createdAt), desc(schema.media.id))'
          replacement = '''.orderBy(\n        ...((options.sort ?? "newest") === "oldest"\n          ? [asc(schema.media.createdAt), asc(schema.media.id)]\n          : [desc(schema.media.createdAt), desc(schema.media.id)]),\n      )'''
          if section.count(anchor) != 2:
              raise SystemExit(f'internal order anchors: {section.count(anchor)}')
          section = section.replace(anchor, replacement)

          anchor = '? this.#encodeInternalCursor(options.albumId, last.createdAt, last.id)'
          replacement = '? this.#encodeInternalCursor(options.albumId, last.createdAt, last.id, options.sort ?? "newest")'
          if section.count(anchor) != 2:
              raise SystemExit(f'encode call anchors: {section.count(anchor)}')
          section = section.replace(anchor, replacement)
          text = text[:start] + section + text[end:]

          anchor = '''  #encodeInternalCursor(albumId: string, createdAt: Date, mediaId: string): string {\n    const encoded = Buffer.from(\n      JSON.stringify({ albumId, createdAt: createdAt.toISOString(), mediaId }),'''
          replacement = '''  #encodeInternalCursor(\n    albumId: string,\n    createdAt: Date,\n    mediaId: string,\n    sort: "newest" | "oldest",\n  ): string {\n    const encoded = Buffer.from(\n      JSON.stringify({ albumId, createdAt: createdAt.toISOString(), mediaId, sort }),'''
          if anchor not in text:
              raise SystemExit('encode helper anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '  #decodeInternalCursor(value: string, albumId: string) {'
          replacement = '''  #decodeInternalCursor(\n    value: string,\n    albumId: string,\n    sort: "newest" | "oldest",\n  ) {'''
          if anchor not in text:
              raise SystemExit('decode helper anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '''        albumId: string;\n        createdAt: string;\n        mediaId: string;\n      };'''
          replacement = '''        albumId: string;\n        createdAt: string;\n        mediaId: string;\n        sort: "newest" | "oldest";\n      };'''
          helper_start = text.index('  #decodeInternalCursor(')
          helper_tail = text[helper_start:]
          if anchor not in helper_tail:
              raise SystemExit('decode payload anchor missing')
          helper_tail = helper_tail.replace(anchor, replacement, 1)
          anchor2 = '        parsed.albumId !== albumId ||\n        Number.isNaN(createdAt.getTime()) ||'
          replacement2 = '        parsed.albumId !== albumId ||\n        parsed.sort !== sort ||\n        Number.isNaN(createdAt.getTime()) ||'
          if anchor2 not in helper_tail:
              raise SystemExit('decode validation anchor missing')
          helper_tail = helper_tail.replace(anchor2, replacement2, 1)
          text = text[:helper_start] + helper_tail
          service.write_text(text)

          workspace = Path('apps/web/src/components/review/review-workspace.tsx')
          text = workspace.read_text()
          anchor = 'type BibOcrFilter = "all" | "completed" | "failed" | "not_started" | "processing" | "unsupported";\ntype RemoteBatchAction = "change_category" | "hide" | "publish" | "restore";'
          replacement = 'type BibOcrFilter = "all" | "completed" | "failed" | "not_started" | "processing" | "unsupported";\ntype SortOrder = "newest" | "oldest";\ntype GridDensity = "compact" | "standard" | "large";\ntype RemoteBatchAction = "change_category" | "hide" | "publish" | "restore";'
          if anchor not in text:
              raise SystemExit('workspace type anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '''const bibOcrFilters = new Set<BibOcrFilter>([\n  "all",\n  "completed",\n  "failed",\n  "not_started",\n  "processing",\n  "unsupported",\n]);'''
          replacement = anchor + '''\nconst sortOrders = new Set<SortOrder>(["newest", "oldest"]);\nconst gridDensities = new Set<GridDensity>(["compact", "standard", "large"]);\nconst reviewGridDensityStorageKey = "photostream:review-grid-density";'''
          if anchor not in text:
              raise SystemExit('workspace constants anchor missing')
          text = text.replace(anchor, replacement, 1)

          unused = '''function cursorSignature(cursor: RemoteCursor): string {\n  return cursor.kind === "single"\n    ? `single:${cursor.value}`\n    : `unpublished:${cursor.draft ?? "-"}:${cursor.pendingReview ?? "-"}`;\n}\n\n'''
          text = text.replace(unused, '', 1)

          anchor = '  const [classOption, setClassOption] = useState("all");\n  const [filtersHydrated, setFiltersHydrated] = useState(false);'
          replacement = '  const [classOption, setClassOption] = useState("all");\n  const [sortOrder, setSortOrder] = useState<SortOrder>("newest");\n  const [gridDensity, setGridDensity] = useState<GridDensity>("standard");\n  const [filtersHydrated, setFiltersHydrated] = useState(false);'
          if anchor not in text:
              raise SystemExit('workspace state anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '    setGradeOption(simpleQueryValue(params, "grade"));\n    setClassOption(simpleQueryValue(params, "class"));\n    setFiltersHydrated(true);'
          replacement = '    setGradeOption(simpleQueryValue(params, "grade"));\n    setClassOption(simpleQueryValue(params, "class"));\n    setSortOrder(enumQueryValue(params, "sort", sortOrders, "newest"));\n    setFiltersHydrated(true);'
          if anchor not in text:
              raise SystemExit('workspace hydration anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '''  useEffect(() => {\n    applyFiltersFromLocation();\n    window.addEventListener("popstate", applyFiltersFromLocation);\n    return () => window.removeEventListener("popstate", applyFiltersFromLocation);\n  }, [applyFiltersFromLocation]);\n'''
          replacement = anchor + '''\n  useEffect(() => {\n    const saved = window.localStorage.getItem(reviewGridDensityStorageKey);\n    if (saved !== null && gridDensities.has(saved as GridDensity)) {\n      setGridDensity(saved as GridDensity);\n    }\n  }, []);\n\n  function changeGridDensity(value: GridDensity): void {\n    setGridDensity(value);\n    window.localStorage.setItem(reviewGridDensityStorageKey, value);\n  }\n'''
          if anchor not in text:
              raise SystemExit('workspace density anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '    setOrDelete("grade", gradeOption);\n    if (gradeOption === "all") url.searchParams.delete("class");\n    else setOrDelete("class", classOption);'
          replacement = anchor + '\n    setOrDelete("sort", sortOrder, "newest");'
          if anchor not in text:
              raise SystemExit('workspace URL anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '    ingestFilter,\n    uploader,\n  ]);'
          replacement = '    ingestFilter,\n    sortOrder,\n    uploader,\n  ]);'
          if anchor not in text:
              raise SystemExit('workspace URL deps anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '      if (gradeOption !== "all") query.set("gradeOptionId", gradeOption);\n      if (gradeOption !== "all" && classOption !== "all") query.set("classOptionId", classOption);\n      if (pageCursor !== undefined) query.set("cursor", pageCursor);'
          replacement = '      if (gradeOption !== "all") query.set("gradeOptionId", gradeOption);\n      if (gradeOption !== "all" && classOption !== "all") query.set("classOptionId", classOption);\n      query.set("sort", sortOrder);\n      if (pageCursor !== undefined) query.set("cursor", pageCursor);'
          if anchor not in text:
              raise SystemExit('workspace query anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '    [bibDecision, bibOcrStatus, category, classOption, gradeOption, ingestFilter, uploader],'
          replacement = '''    [\n      bibDecision,\n      bibOcrStatus,\n      category,\n      classOption,\n      gradeOption,\n      ingestFilter,\n      sortOrder,\n      uploader,\n    ],'''
          if anchor not in text:
              raise SystemExit('workspace query deps anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '''    return [...localItems, ...remoteItems].sort((left, right) =>\n      right.createdAt.localeCompare(left.createdAt),\n    );\n  }, [featuredIds, localMedia, remoteMedia]);'''
          replacement = '''    return [...localItems, ...remoteItems].sort((left, right) =>\n      sortOrder === "oldest"\n        ? left.createdAt.localeCompare(right.createdAt)\n        : right.createdAt.localeCompare(left.createdAt),\n    );\n  }, [featuredIds, localMedia, remoteMedia, sortOrder]);'''
          if anchor not in text:
              raise SystemExit('workspace item order anchor missing')
          text = text.replace(anchor, replacement, 1)

          uploader_block = '''            {uploaders.length === 0 ? null : (\n              <Select\n                items={[\n                  { label: "全部上传者", value: "all" },\n                  ...uploaders.map((item) => ({ label: item.displayName, value: item.id })),\n                ]}\n                onValueChange={(value) => {\n                  setUploader(value ?? "all");\n                  resetSelection();\n                }}\n                value={uploader}\n              >\n                <SelectTrigger aria-label="上传者筛选" className="h-7 w-28 text-xs">\n                  <SelectValue />\n                </SelectTrigger>\n                <SelectContent>\n                  <SelectGroup>\n                    <SelectItem value="all">全部上传者</SelectItem>\n                    {uploaders.map((item) => (\n                      <SelectItem key={item.id} value={item.id}>\n                        {item.displayName}\n                      </SelectItem>\n                    ))}\n                  </SelectGroup>\n                </SelectContent>\n              </Select>\n            )}'''
          controls = uploader_block + '''\n            <Select\n              items={[\n                { label: "最新优先", value: "newest" },\n                { label: "最早优先", value: "oldest" },\n              ]}\n              onValueChange={(value) => {\n                setSortOrder((value ?? "newest") as SortOrder);\n                resetSelection();\n              }}\n              value={sortOrder}\n            >\n              <SelectTrigger aria-label="照片排序" className="h-7 w-24 text-xs">\n                <SelectValue />\n              </SelectTrigger>\n              <SelectContent>\n                <SelectGroup>\n                  <SelectItem value="newest">最新优先</SelectItem>\n                  <SelectItem value="oldest">最早优先</SelectItem>\n                </SelectGroup>\n              </SelectContent>\n            </Select>\n            <Select\n              items={[\n                { label: "紧凑", value: "compact" },\n                { label: "标准", value: "standard" },\n                { label: "大图", value: "large" },\n              ]}\n              onValueChange={(value) => changeGridDensity((value ?? "standard") as GridDensity)}\n              value={gridDensity}\n            >\n              <SelectTrigger aria-label="网格密度" className="h-7 w-20 text-xs">\n                <SelectValue />\n              </SelectTrigger>\n              <SelectContent>\n                <SelectGroup>\n                  <SelectItem value="compact">紧凑</SelectItem>\n                  <SelectItem value="standard">标准</SelectItem>\n                  <SelectItem value="large">大图</SelectItem>\n                </SelectGroup>\n              </SelectContent>\n            </Select>'''
          if uploader_block not in text:
              raise SystemExit('workspace uploader block missing')
          text = text.replace(uploader_block, controls, 1)

          anchor = '<div className="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6">'
          replacement = '''<div\n          className={cn(\n            "grid grid-cols-2 gap-2 sm:grid-cols-3",\n            gridDensity === "compact" && "md:grid-cols-4 xl:grid-cols-7 2xl:grid-cols-8",\n            gridDensity === "standard" && "md:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6",\n            gridDensity === "large" && "md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5",\n          )}\n        >'''
          if anchor not in text:
              raise SystemExit('workspace grid anchor missing')
          workspace.write_text(text.replace(anchor, replacement, 1))
          PY
          pnpm exec biome check --write apps/api/src/routes/photos.ts apps/api/src/media/service.ts apps/web/src/components/review/review-workspace.tsx
          pnpm typecheck
      - name: Commit integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/routes/photos.ts apps/api/src/media/service.ts apps/web/src/components/review/review-workspace.tsx
          git commit -m 'feat(review): add sorting and grid density'
          git push origin HEAD:review-workspace-efficiency
