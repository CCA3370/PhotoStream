name: Admin refresh autofix

on:
  push:
    branches:
      - admin-workspace-refresh

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: admin-workspace-refresh
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply known CI fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          overview = "apps/web/src/app/(studio)/studio/albums/[id]/page.tsx"
          replace(
              overview,
              '  draft: "待发布",\n  published: "已发布",',
              '  draft: "待发布",\n  pending_review: "待审核",\n  published: "已发布",',
          )

          settings = "apps/web/src/components/albums/album-settings.tsx"
          replace(
              settings,
              '''export function AlbumSettings({\n  categories,\n  dataSaver,\n  initialAlbum,\n}: Readonly<{\n  categories: readonly CategoryOption[];\n  dataSaver: DataSaverSettingView;\n  initialAlbum: AlbumView;\n}>) {''',
              '''export function AlbumSettings({\n  categories = [],\n  dataSaver = { enabled: false },\n  initialAlbum,\n  bibConfig: initialBibConfig,\n  faceConfig: initialFaceConfig,\n}: Readonly<{\n  categories?: readonly CategoryOption[] | undefined;\n  dataSaver?: DataSaverSettingView | undefined;\n  initialAlbum: AlbumView;\n  bibConfig?: BibConfigView | undefined;\n  faceConfig?: FaceConfigView | undefined;\n  statistics?: unknown;\n}>) {''',
          )
          replace(
              settings,
              '  const [bibConfig, setBibConfig] = useState<BibConfigView | null>(null);\n  const [faceConfig, setFaceConfig] = useState<FaceConfigView | null>(null);',
              '  const [bibConfig, setBibConfig] = useState<BibConfigView | null>(initialBibConfig ?? null);\n  const [faceConfig, setFaceConfig] = useState<FaceConfigView | null>(initialFaceConfig ?? null);',
          )

          review = "apps/web/src/components/review/review-workspace.tsx"
          replace(
              review,
              '''  useEffect(() => {\n    setSelectedKeys(new Set());\n    lastSelectedIndexRef.current = null;\n  }, [category, filter, uploader]);''',
              '''  function resetSelection(): void {\n    setSelectedKeys(new Set());\n    lastSelectedIndexRef.current = null;\n  }''',
          )
          replace(
              review,
              '              onClick={() => setFilter(item.id)}',
              '''              onClick={() => {\n                setFilter(item.id);\n                resetSelection();\n              }}''',
          )
          replace(
              review,
              '              onValueChange={(value) => setCategory(value ?? "all")}',
              '''              onValueChange={(value) => {\n                setCategory(value ?? "all");\n                resetSelection();\n              }}''',
          )
          replace(
              review,
              '              onValueChange={(value) => setUploader(value ?? "all")}',
              '''              onValueChange={(value) => {\n                setUploader(value ?? "all");\n                resetSelection();\n              }}''',
          )
          replace(
              review,
              '''      const localTargets = selectedItems.filter(\n        (item) => item.source === "local" && item.publicationStatus === "local",\n      );''',
              '''      const localTargets = selectedItems.filter(\n        (item): item is Extract<ReviewItem, { source: "local" }> =>\n          item.source === "local" && item.publicationStatus === "local",\n      );''',
          )
          replace(
              review,
              '''      const localOnly = selectedItems.filter(\n        (item) => item.source === "local" && item.local.photo.mediaId === null,\n      );''',
              '''      const localOnly = selectedItems.filter(\n        (item): item is Extract<ReviewItem, { source: "local" }> =>\n          item.source === "local" && item.local.photo.mediaId === null,\n      );''',
          )

          upload = "apps/web/src/components/uploads/upload-queue.tsx"
          replace(
              upload,
              '''  const enqueue = useCallback(\n    (files: readonly File[]) => {''',
              '''  function enqueue(files: readonly File[]): void {''',
          )
          replace(
              upload,
              '''      if (directoryInputRef.current !== null) directoryInputRef.current.value = "";\n    },\n    [categoryId, syncTasks],\n  );''',
              '''      if (directoryInputRef.current !== null) directoryInputRef.current.value = "";\n  }''',
          )

          story = "apps/web/src/components/shells/shells.stories.tsx"
          replace(story, '      albumId="demo"\n', '')
          replace(
              story,
              '''      queue={{\n        paused: false,\n        processing: 0,''',
              '''      queue={{\n        paused: false,\n        queued: 0,\n        processing: 0,''',
          )
          replace(
              story,
              '''        pendingReview: 0,\n        completed: 0,''',
              '''        pendingReview: 0,\n        completed: 0,\n        total: 0,''',
          )
          PY

      - name: Format touched files
        shell: bash
        run: |
          pnpm exec biome check --write \
            'apps/web/src/app/(studio)/studio/albums/[id]/page.tsx' \
            'apps/web/src/app/(studio)/studio/albums/[id]/review/page.tsx' \
            'apps/web/src/app/(studio)/studio/albums/[id]/settings/page.tsx' \
            'apps/web/src/app/(studio)/studio/albums/[id]/upload/page.tsx' \
            apps/web/src/components/albums/album-context-nav.tsx \
            apps/web/src/components/albums/album-settings.tsx \
            apps/web/src/components/albums/album-workspace-header.tsx \
            apps/web/src/components/review/review-workspace.tsx \
            apps/web/src/components/shells/upload-shell.tsx \
            apps/web/src/components/uploads/upload-queue.tsx \
            apps/web/src/components/shells/shells.stories.tsx || true
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web
          git commit -m "Fix admin refresh CI issues"
          git push origin HEAD:admin-workspace-refresh
