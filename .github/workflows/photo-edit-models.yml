name: Photo edit model validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/photo-edit-models.yml"
      - "Dockerfile"
      - "pnpm-lock.yaml"
      - "scripts/provision-photo-edit-models.mjs"
      - "apps/web/src/lib/photo-edit/ai-models.ts"
      - "apps/web/next.config.ts"

permissions:
  contents: read

concurrency:
  group: photo-edit-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-models:
    name: Production model assets
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache restoration models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local-data/photo-edit-model-cache
          key: photo-edit-models-restoration-v1-20260918

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision and verify pinned model assets
        run: pnpm photo-edit:assets

      - name: Verify host asset digests
        shell: bash
        run: |
          cd apps/web/public/assets/models/photo-edit/restoration-v1-20260918
          sha256sum -c <<'EOF'
          231be201ab413dbc999d7951caa9844846b93a12a40a41e037d6b5888ed4e88c  scunet_color_real_psnr.onnx
          98825ea1210b641c71e5f052f582c70c49fd44b35387ebe2c034268c17df3feb  scunet_color_real_psnr.onnx.data
          07263f416febecce10193dd648e950b22e397cf521eedab1a114ef77b2bc9587  deblurring_nafnet_2025may.onnx
          5687566b1bc1c8cf628d76c2ddb16b2a3b81a7997273d4666564880495088e57  ort/ort-wasm-simd-threaded.mjs
          be0e129949062ad50290ef94683fac8be5bb6156f709e030b7a5f1661a2f6c17  ort/ort-wasm-simd-threaded.wasm
          9a99acd12acc495184c9ea4d458ac9424f8180aacfbc7b8371ed64f9351e4a81  ort/ort-wasm-simd-threaded.jsep.mjs
          2e0a3d0e3f6b7c13ecfaba38c13691fd19c9ed470e72f9d7d8416ca59ab6dbcd  ort/ort-wasm-simd-threaded.jsep.wasm
          EOF

      - name: Build production Web image
        shell: bash
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --target web \
            --build-arg API_INTERNAL_URL=http://127.0.0.1:3001 \
            --build-arg MEDIA_BASE_URL=https://cdn.example.invalid \
            --tag photostream-web:photo-edit-model-verify \
            .

      - name: Verify model assets inside image
        shell: bash
        run: |
          docker run --rm --entrypoint sh photostream-web:photo-edit-model-verify -ec '
            cd /app/apps/web/public/assets/models/photo-edit/restoration-v1-20260918
            echo "231be201ab413dbc999d7951caa9844846b93a12a40a41e037d6b5888ed4e88c  scunet_color_real_psnr.onnx" | sha256sum -c -
            echo "98825ea1210b641c71e5f052f582c70c49fd44b35387ebe2c034268c17df3feb  scunet_color_real_psnr.onnx.data" | sha256sum -c -
            echo "07263f416febecce10193dd648e950b22e397cf521eedab1a114ef77b2bc9587  deblurring_nafnet_2025may.onnx" | sha256sum -c -
            echo "5687566b1bc1c8cf628d76c2ddb16b2a3b81a7997273d4666564880495088e57  ort/ort-wasm-simd-threaded.mjs" | sha256sum -c -
            echo "be0e129949062ad50290ef94683fac8be5bb6156f709e030b7a5f1661a2f6c17  ort/ort-wasm-simd-threaded.wasm" | sha256sum -c -
            echo "9a99acd12acc495184c9ea4d458ac9424f8180aacfbc7b8371ed64f9351e4a81  ort/ort-wasm-simd-threaded.jsep.mjs" | sha256sum -c -
            echo "2e0a3d0e3f6b7c13ecfaba38c13691fd19c9ed470e72f9d7d8416ca59ab6dbcd  ort/ort-wasm-simd-threaded.jsep.wasm" | sha256sum -c -
          '

      - name: Verify immutable static delivery
        shell: bash
        run: |
          container_id=$(docker run -d -p 3100:3000 photostream-web:photo-edit-model-verify)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --head \
              http://127.0.0.1:3100/assets/models/photo-edit/restoration-v1-20260918/scunet_color_real_psnr.onnx \
              >/tmp/photo-edit-model-head.txt; then
              break
            fi
            sleep 1
          done
          grep -i '^cache-control: public, max-age=31536000, immutable' /tmp/photo-edit-model-head.txt
          grep -i '^cross-origin-resource-policy: same-origin' /tmp/photo-edit-model-head.txt
