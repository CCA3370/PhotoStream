name: Apply WeChat long-press save fix v4

on:
  push:
    branches:
      - fix/wechat-long-press-save-http-url
    paths:
      - .github/workflows/apply-wechat-longpress-save-fix-v4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wechat-long-press-save-http-url
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply corrected patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-wechat-longpress-save-fix.yml').read_text()
          marker = "python3 <<'PY'\n"
          payload = textwrap.dedent(workflow.split(marker, 1)[1].split("\n          PY", 1)[0])
          old = '''cleanup = ''' + "'''" + '''    if (preparedObjectUrlRef.current !== null) {\\n      URL.revokeObjectURL(preparedObjectUrlRef.current);\\n      preparedObjectUrlRef.current = null;\\n    }\\n''' + "'''" + '''\nif text.count(cleanup) != 2:\n    raise RuntimeError(f"expected two main object URL cleanup blocks, found {text.count(cleanup)}")\ntext = text.replace(cleanup, "")'''
          new = '''cleanup = ''' + "'''" + '''    if (preparedObjectUrlRef.current !== null) {\\n      URL.revokeObjectURL(preparedObjectUrlRef.current);\\n      preparedObjectUrlRef.current = null;\\n    }\\n''' + "'''" + '''\ntext = replace_once(text, cleanup, "", "main selected object URL cleanup")\nnested_cleanup = ''' + "'''" + '''      if (preparedObjectUrlRef.current !== null) {\\n        URL.revokeObjectURL(preparedObjectUrlRef.current);\\n        preparedObjectUrlRef.current = null;\\n      }\\n''' + "'''" + '''\ntext = replace_once(text, nested_cleanup, "", "main unmount object URL cleanup")'''
          if old not in payload:
              raise RuntimeError('could not patch cleanup matcher')
          payload = payload.replace(old, new, 1)
          exec(payload, {})

          shared = Path('apps/web/src/components/gallery/shared-photo-viewer.tsx')
          text = shared.read_text()
          old_deps = '[preparedImage, preview?.kind, previewLoaded, replacePreparedImage, showSaveHint],'
          new_deps = '[preparedImage, preview?.kind, preview?.url, previewLoaded, replacePreparedImage, showSaveHint],'
          if old_deps not in text:
              raise RuntimeError('shared preview dependency target missing')
          shared.write_text(text.replace(old_deps, new_deps, 1))
          PY
      - name: Format and validate
        run: |
          pnpm exec biome check --write apps/web/src/components/gallery/photo-lightbox.tsx apps/web/src/components/gallery/shared-photo-viewer.tsx
          pnpm --filter @photostream/web typecheck
      - name: Commit fix and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-wechat-longpress-save-fix.yml .github/workflows/apply-wechat-longpress-save-fix-v2.yml .github/workflows/apply-wechat-longpress-save-fix-v3.yml .github/workflows/apply-wechat-longpress-save-fix-v4.yml
          git add apps/web/src/components/gallery/photo-lightbox.tsx apps/web/src/components/gallery/shared-photo-viewer.tsx
          git commit -m "Fix WeChat long-press image saving"
          git push origin HEAD:fix/wechat-long-press-save-http-url
