name: Admin refresh finalizer

on:
  push:
    branches:
      - admin-workspace-refresh

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: admin-workspace-refresh
      - name: Cover remote pending-review state
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/review/review-workspace.tsx')
          text = path.read_text()
          old_filter = '''        if (filter === "local")\n          return item.source === "local" && item.publicationStatus === "local";'''
          new_filter = '''        if (filter === "local")\n          return (\n            (item.source === "local" && item.publicationStatus === "local") ||\n            item.publicationStatus === "draft" ||\n            item.publicationStatus === "pending_review"\n          );'''
          old_batch = '''          item.source === "remote" && item.publicationStatus === "draft",'''
          new_batch = '''          item.source === "remote" &&\n          (item.publicationStatus === "draft" || item.publicationStatus === "pending_review"),'''
          if text.count(old_filter) != 1:
              raise SystemExit('expected one local filter block')
          if text.count(old_batch) != 1:
              raise SystemExit('expected one remote batch publish condition')
          text = text.replace(old_filter, new_filter).replace(old_batch, new_batch)
          path.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/review/review-workspace.tsx
          git commit -m "Cover pending review items in batch publish"
          git push origin HEAD:admin-workspace-refresh
