name: Format generated migration metadata

on:
  push:
    branches:
      - codex/public-gallery-ux-face-search

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/public-gallery-ux-face-search
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format generated metadata
        run: pnpm exec biome check --write packages/db/drizzle/meta/0018_snapshot.json packages/db/drizzle/meta/_journal.json
      - name: Commit and remove helper
        run: |
          rm .github/workflows/format-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format generated Drizzle migration metadata'
          git push origin HEAD:codex/public-gallery-ux-face-search
