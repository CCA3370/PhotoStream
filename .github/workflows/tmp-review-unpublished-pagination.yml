name: Temporary review unpublished pagination integrator

on:
  push:
    branches:
      - review-workspace-efficiency

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: review-workspace-efficiency
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Integrate unpublished pagination
        run: |
          python3 - <<'PY'
          from pathlib import Path

          routes = Path('apps/api/src/routes/photos.ts')
          text = routes.read_text()
          anchor = '    publicationStatus: publicationStatusSchema.optional(),\n    featured: z.enum(["true"]).optional(),'
          replacement = '    publicationStatus: publicationStatusSchema.optional(),\n    publicationGroup: z.enum(["unpublished"]).optional(),\n    featured: z.enum(["true"]).optional(),'
          if text.count(anchor) != 2:
              raise SystemExit(f'route publication anchors: {text.count(anchor)}')
          text = text.replace(anchor, replacement)
          refine = '''  .strict()\n  .refine((value) => value.classOptionId === undefined || value.gradeOptionId !== undefined, {'''
          replacement_refine = '''  .strict()\n  .refine(\n    (value) => value.publicationStatus === undefined || value.publicationGroup === undefined,\n    {\n      message: "发布状态与发布状态组不能同时筛选",\n      path: ["publicationGroup"],\n    },\n  )\n  .refine((value) => value.classOptionId === undefined || value.gradeOptionId !== undefined, {'''
          if text.count(refine) != 2:
              raise SystemExit(f'route refine anchors: {text.count(refine)}')
          routes.write_text(text.replace(refine, replacement_refine))

          service = Path('apps/api/src/media/service.ts')
          text = service.read_text()
          start = text.index('  async listInternalMedia(')
          end = text.index('  async listAlbumUploaders(', start)
          section = text[start:end]
          anchor = '''      readonly publicationStatus?:\n        | (typeof schema.publicationStatusEnum.enumValues)[number]\n        | undefined;\n      readonly featured?: "true" | undefined;'''
          replacement = '''      readonly publicationStatus?:\n        | (typeof schema.publicationStatusEnum.enumValues)[number]\n        | undefined;\n      readonly publicationGroup?: "unpublished" | undefined;\n      readonly featured?: "true" | undefined;'''
          if section.count(anchor) != 2:
              raise SystemExit(f'service publication option anchors: {section.count(anchor)}')
          section = section.replace(anchor, replacement)
          anchor = '''    if (options.publicationStatus !== undefined) {\n      conditions.push(eq(schema.media.publicationStatus, options.publicationStatus));\n    }'''
          replacement = '''    if (options.publicationStatus !== undefined) {\n      conditions.push(eq(schema.media.publicationStatus, options.publicationStatus));\n    } else if (options.publicationGroup === "unpublished") {\n      conditions.push(inArray(schema.media.publicationStatus, ["draft", "pending_review"]));\n    }'''
          if section.count(anchor) != 1:
              raise SystemExit(f'list condition anchors: {section.count(anchor)}')
          section = section.replace(anchor, replacement, 1)
          anchor = '''    if (options.publicationStatus !== undefined) {\n      baseConditions.push(eq(schema.media.publicationStatus, options.publicationStatus));\n    }'''
          replacement = '''    if (options.publicationStatus !== undefined) {\n      baseConditions.push(eq(schema.media.publicationStatus, options.publicationStatus));\n    } else if (options.publicationGroup === "unpublished") {\n      baseConditions.push(inArray(schema.media.publicationStatus, ["draft", "pending_review"]));\n    }'''
          if section.count(anchor) != 1:
              raise SystemExit(f'selection condition anchors: {section.count(anchor)}')
          section = section.replace(anchor, replacement, 1)
          service.write_text(text[:start] + section + text[end:])

          workspace = Path('apps/web/src/components/review/review-workspace.tsx')
          text = workspace.read_text()
          anchor_start = text.index('type RemoteCursor =')
          anchor_end = text.index('\n\ninterface RemotePage', anchor_start)
          text = text[:anchor_start] + 'type RemoteCursor = { readonly kind: "single"; readonly value: string };' + text[anchor_end:]

          start = text.index('  const fetchRemote = useCallback(')
          end = text.index('\n\n  const refreshRemote = useCallback', start)
          replacement = '''  const fetchRemote = useCallback(\n    async (pageCursor?: RemoteCursor): Promise<RemotePage> => {\n      const publicationStatus =\n        filter === "published" ? "published" : filter === "hidden" ? "hidden" : undefined;\n      const query = buildRemoteQuery(publicationStatus, pageCursor?.value);\n      if (filter === "local") query.set("publicationGroup", "unpublished");\n      if (filter === "featured") query.set("featured", "true");\n      const page = await clientGet<InternalMediaList>(\n        `/api/v1/albums/${albumId}/media?${query.toString()}`,\n      );\n      return {\n        items: page.items,\n        nextCursor:\n          page.nextCursor === null ? null : { kind: "single" as const, value: page.nextCursor },\n      };\n    },\n    [albumId, buildRemoteQuery, filter],\n  );'''
          text = text[:start] + replacement + text[end:]

          anchor = '''    const query = buildRemoteQuery(publicationStatus, pageCursor);\n    query.set("limit", "1000");\n    if (filter === "featured") query.set("featured", "true");'''
          replacement = '''    const query = buildRemoteQuery(publicationStatus, pageCursor);\n    query.set("limit", "1000");\n    if (filter === "local") query.set("publicationGroup", "unpublished");\n    if (filter === "featured") query.set("featured", "true");'''
          if anchor not in text:
              raise SystemExit('selection query anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '''      if (filter === "local") {\n        const [draft, pending] = await Promise.all([\n          collectSelection("draft"),\n          collectSelection("pending_review"),\n        ]);\n        for (const item of draft.values()) remote.set(item.id, item);\n        for (const item of pending.values()) remote.set(item.id, item);\n      } else {\n        const publicationStatus =\n          filter === "published" ? "published" : filter === "hidden" ? "hidden" : undefined;\n        const selected = await collectSelection(publicationStatus);\n        for (const item of selected.values()) remote.set(item.id, item);\n      }'''
          replacement = '''      const publicationStatus =\n        filter === "published" ? "published" : filter === "hidden" ? "hidden" : undefined;\n      const selected = await collectSelection(publicationStatus);\n      for (const item of selected.values()) remote.set(item.id, item);'''
          if anchor not in text:
              raise SystemExit('select all local dual-stream anchor missing')
          text = text.replace(anchor, replacement, 1)
          workspace.write_text(text)
          PY
          pnpm exec biome check --write apps/api/src/routes/photos.ts apps/api/src/media/service.ts apps/web/src/components/review/review-workspace.tsx
          pnpm typecheck
      - name: Commit integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/routes/photos.ts apps/api/src/media/service.ts apps/web/src/components/review/review-workspace.tsx
          git commit -m 'fix(review): paginate unpublished media as one stream'
          git push origin HEAD:review-workspace-efficiency
