      showNotice(`已选择全部匹配结果：${localKeys.length + remote.size} 张`);
    } catch (cause) {
      setError(cause instanceof Error ? cause.message : "选择全部匹配结果失败");
    } finally {
      setSelectingAll(false);
    }
  }'''
