name: Temporary scalable review selection integrator

on:
  push:
    branches:
      - review-workspace-efficiency

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: review-workspace-efficiency
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Extract and run integrator
        run: |
          git show HEAD^:.github/workflows/tmp-scalable-review-selection.yml > /tmp/old-selection-workflow.yml
          sed -n "/^          python3 - <<'PY'$/,/^          PY$/p" /tmp/old-selection-workflow.yml | sed '1d;$d;s/^          //' > /tmp/integrate.py
          python3 /tmp/integrate.py
          pnpm exec biome check --write apps/api/src/routes/photos.ts apps/api/src/media/service.ts apps/web/src/components/review/review-workspace.tsx
          pnpm typecheck
          pnpm exec vitest run apps/api/src/media/service.integration.test.ts apps/web/src/lib/local-review-queue.test.ts
      - name: Commit scalable selection
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/routes/photos.ts apps/api/src/media/service.ts apps/web/src/components/review/review-workspace.tsx
          git commit -m 'perf(review): make select-all metadata-only'
          git push origin HEAD:review-workspace-efficiency
