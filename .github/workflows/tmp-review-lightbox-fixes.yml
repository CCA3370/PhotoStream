name: Temporary review lightbox fix integrator

on:
  push:
    branches:
      - review-workspace-efficiency

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: review-workspace-efficiency
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lightbox = Path('apps/web/src/components/review/review-lightbox.tsx')
          text = lightbox.read_text()
          text = text.replace(
              '  const spaceTapRef = useRef<{ readonly key: string; readonly at: number } | null>(null);\n',
              '',
              1,
          )
          text = text.replace('    spaceTapRef.current = null;\n', '', 1)
          old_space = '''      } else if (event.code === "Space") {\n        event.preventDefault();\n        event.stopPropagation();\n        if (event.repeat || selected.pendingAction !== null) return;\n        if (selected.publicationStatus === "published" || selected.publicationStatus === "hidden") {\n          spaceTapRef.current = null;\n          onToggleVisibility(selected.key);\n          return;\n        }\n        const now = Date.now();\n        if (spaceTapRef.current?.key === selected.key && now - spaceTapRef.current.at <= 700) {\n          spaceTapRef.current = null;\n          onStateAction(selected.key);\n        } else {\n          spaceTapRef.current = { key: selected.key, at: now };\n        }\n'''
          new_space = '''      } else if (event.code === "Space") {\n        event.preventDefault();\n        event.stopPropagation();\n        if (event.repeat || selected.pendingAction !== null) return;\n        if (selected.publicationStatus === "published" || selected.publicationStatus === "hidden") {\n          onToggleVisibility(selected.key);\n          return;\n        }\n        onStateAction(selected.key);\n'''
          if old_space not in text:
              raise SystemExit('space keyboard block missing')
          text = text.replace(old_space, new_space, 1)
          text = text.replace(
              '            左右键切换，滚轮、双击或加减键缩放，拖动查看；已发布照片空格切换显示状态，未发布照片连续两次空格发布，回车切换精选，连续两次\n            Delete 删除。',
              '            左右键切换，滚轮、双击或加减键缩放，拖动查看；空格发布或切换显示状态，回车切换精选，连续两次 Delete 删除。',
              1,
          )
          text = text.replace(
              '                  <div className="mx-0.5 h-5 w-px bg-white/10" />\n\n',
              '',
              1,
          )
          text = text.replace(
              'published ? "隐藏 (Space)" : hidden ? "显示 (Space)" : "发布（双击 Space）"',
              'published ? "隐藏 (Space)" : hidden ? "显示 (Space)" : "发布 (Space)"',
              1,
          )
          lightbox.write_text(text)

          toast = Path('apps/web/src/components/ui/toast.tsx')
          text = toast.read_text()
          old = 'pointer-events-none fixed inset-x-4 bottom-4 z-[100] mx-auto w-auto max-w-sm outline-none sm:right-4 sm:left-auto sm:mx-0 sm:w-full'
          new = 'pointer-events-none fixed inset-x-4 bottom-4 z-[100] mx-auto w-auto max-w-sm outline-none sm:right-auto sm:left-4 sm:mx-0 sm:w-full'
          if old not in text:
              raise SystemExit('toast viewport class missing')
          toast.write_text(text.replace(old, new, 1))

          editor = Path('apps/web/src/components/bib/bib-review-editor.tsx')
          text = editor.read_text()
          text = text.replace(
              '  if (tag.status === "needs_review") return "需复核";\n  return "识别候选";',
              '  if (tag.status === "needs_review") return "需复核";\n  if (tag.status === "rejected") return "OCR 结果";\n  return "识别候选";',
              1,
          )
          state_anchor = '  const [validationError, setValidationError] = useState<string | null>(null);\n\n'
          if state_anchor not in text:
              raise SystemExit('editor state anchor missing')
          text = text.replace(
              state_anchor,
              state_anchor + '  const noNumber = state?.review.decision === "no_number_confirmed";\n\n',
              1,
          )
          text = text.replace(
              '        .filter((tag) => tag.status !== "rejected")',
              '        .filter((tag) => tag.status !== "rejected" || (noNumber && tag.source === "ocr"))',
              1,
          )
          text = text.replace('    [state],\n  );\n  const selectedNumbers', '    [noNumber, state],\n  );\n  const defaultOcrNumbers = useMemo(\n    () => [\n      ...new Set(\n        activeTags.filter((tag) => tag.source === "ocr").map((tag) => tag.number),\n      ),\n    ],\n    [activeTags],\n  );\n  const selectedNumbers', 1)
          old_effect = '''  useEffect(() => {\n    if (state?.review.decision === "no_number_confirmed") {\n      setNumber("");\n      setDirty(false);\n      return;\n    }\n    const confirmedNumbers = activeTags\n      .filter((tag) => tag.status === "confirmed")\n      .map((tag) => tag.number);\n    if (confirmedNumbers.length > 0) {\n      setNumber(confirmedNumbers.join(","));\n      setDirty(false);\n      return;\n    }\n    if (!dirty) setNumber(activeTags[0]?.number ?? "");\n  }, [activeTags, dirty, state?.review.decision]);\n'''
          new_effect = '''  useEffect(() => {\n    const confirmedNumbers = activeTags\n      .filter((tag) => tag.status === "confirmed")\n      .map((tag) => tag.number);\n    if (confirmedNumbers.length > 0) {\n      setNumber(confirmedNumbers.join(","));\n      setDirty(false);\n      return;\n    }\n    if (!dirty) setNumber(defaultOcrNumbers.join(","));\n  }, [activeTags, defaultOcrNumbers, dirty]);\n'''
          if old_effect not in text:
              raise SystemExit('editor number effect missing')
          text = text.replace(old_effect, new_effect, 1)
          text = text.replace(
              '        onChange(result);\n        setNumber("");\n        setDirty(false);',
              '        onChange(result);\n        setDirty(false);',
              1,
          )
          text = text.replace('  const noNumber = state?.review.decision === "no_number_confirmed";\n\n  if (mediaId', '  if (mediaId', 1)
          text = text.replace(
              '? "已人工确认此照片没有号码"',
              '? "已人工确认此照片没有号码；仍可采用原识别结果或手动输入号码重新设定。"',
              1,
          )
          editor.write_text(text)

          queue = Path('apps/web/src/lib/local-review-queue.ts')
          text = queue.read_text()
          old_tags = '''  const tags: BibTagView[] = confirmed\n    ? photo.bib.confirmedNumbers.map((number, index) =>\n        localTag({\n          id: `local-manual-${photo.id}-${index}`,\n          mediaId,\n          number,\n          status: "confirmed",\n          source: "manual",\n          confidence: null,\n          quadrilateral: null,\n          ruleVersion,\n          modelVersion: null,\n          createdAt: photo.bib.decidedAt ?? photo.createdAt,\n          confirmedAt: photo.bib.decidedAt,\n        }),\n      )\n    : photo.bib.decision === "pending"\n      ? photo.bib.candidates.map((candidate, index) =>\n          localTag({\n            id: `local-ocr-${photo.id}-${index}`,\n            mediaId,\n            number: candidate.text,\n            status: "suggested",\n            source: "ocr",\n            confidence: candidate.confidence,\n            quadrilateral: candidate.quadrilateral,\n            ruleVersion,\n            modelVersion: candidate.modelVersion,\n            createdAt: photo.createdAt,\n            confirmedAt: null,\n          }),\n        )\n      : [];\n'''
          new_tags = '''  const tags: BibTagView[] = confirmed\n    ? photo.bib.confirmedNumbers.map((number, index) =>\n        localTag({\n          id: `local-manual-${photo.id}-${index}`,\n          mediaId,\n          number,\n          status: "confirmed",\n          source: "manual",\n          confidence: null,\n          quadrilateral: null,\n          ruleVersion,\n          modelVersion: null,\n          createdAt: photo.bib.decidedAt ?? photo.createdAt,\n          confirmedAt: photo.bib.decidedAt,\n        }),\n      )\n    : photo.bib.candidates.map((candidate, index) =>\n        localTag({\n          id: `local-ocr-${photo.id}-${index}`,\n          mediaId,\n          number: candidate.text,\n          status: photo.bib.decision === "no_number_confirmed" ? "rejected" : "suggested",\n          source: "ocr",\n          confidence: candidate.confidence,\n          quadrilateral: candidate.quadrilateral,\n          ruleVersion,\n          modelVersion: candidate.modelVersion,\n          createdAt: photo.createdAt,\n          confirmedAt: null,\n        }),\n      );\n'''
          if old_tags not in text:
              raise SystemExit('local bib tags block missing')
          queue.write_text(text.replace(old_tags, new_tags, 1))

          test = Path('apps/web/src/lib/local-review-queue.test.ts')
          text = test.read_text()
          old_expect = '''    expect(state.review.decision).toBe("no_number_confirmed");\n    expect(state.tags).toEqual([]);\n'''
          new_expect = '''    expect(state.review.decision).toBe("no_number_confirmed");\n    expect(state.tags).toHaveLength(1);\n    expect(state.tags[0]).toMatchObject({\n      number: "101999",\n      status: "rejected",\n      source: "ocr",\n    });\n'''
          if old_expect not in text:
              raise SystemExit('local bib test expectation missing')
          test.write_text(text.replace(old_expect, new_expect, 1))
          PY
          pnpm exec biome check --write apps/web/src/components/review/review-lightbox.tsx apps/web/src/components/ui/toast.tsx apps/web/src/components/bib/bib-review-editor.tsx apps/web/src/lib/local-review-queue.ts apps/web/src/lib/local-review-queue.test.ts
          pnpm typecheck
          pnpm exec vitest run apps/web/src/lib/local-review-queue.test.ts
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/review/review-lightbox.tsx apps/web/src/components/ui/toast.tsx apps/web/src/components/bib/bib-review-editor.tsx apps/web/src/lib/local-review-queue.ts apps/web/src/lib/local-review-queue.test.ts
          git commit -m 'fix(review): streamline lightbox review actions'
          git push origin HEAD:review-workspace-efficiency
