name: Apply security audit fixes v3

on:
  push:
    branches:
      - fix/security-audit-20260915

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/security-audit-20260915
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Extract and correct deterministic patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/security-audit-fix.yml').read_text()
          marker = "          node <<'NODE'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          NODE", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"

          old_retry = "exact(operations, '    assertRecentAuthentication(options.actor.authenticatedAt, now);\\n', '', 1);"
          new_retry = """exact(operations,\n  '    const now = options.now ?? new Date();\\n    assertRecentAuthentication(options.actor.authenticatedAt, now);\\n    await this.#database\\n      .update(schema.deletionTasks)',\n  '    const now = options.now ?? new Date();\\n    await this.#database\\n      .update(schema.deletionTasks)'\n);"""
          if script.count(old_retry) != 1:
              raise SystemExit(f'expected one retry-auth patch marker, got {script.count(old_retry)}')
          script = script.replace(old_retry, new_retry)

          settings_start = "regex(settings, /    \\.\\.\\.\\(input\\.previewDownloadEnabled"
          i = script.find(settings_start)
          if i < 0:
              raise SystemExit('settings merge regex marker not found')
          j = script.find("\n", i)
          if j < 0:
              raise SystemExit('settings merge regex line terminator not found')
          old_settings = script[i:j]
          new_settings = """exact(settings,\n  '    ...(input.previewDownloadEnabled === undefined\\n      ? {}\\n      : { previewDownloadEnabled: updated.previewDownloadEnabled }),\\n    ...(input.originalDownloadEnabled === undefined\\n      ? {}\\n      : { originalDownloadEnabled: updated.originalDownloadEnabled }),\\n',\n  ''\n);"""
          script = script[:i] + new_settings + script[j:]

          Path('/tmp/apply-security-fixes.js').write_text(script)
          PY
          node /tmp/apply-security-fixes.js
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Format changed source
        run: |
          pnpm exec biome format --write \
            apps/api/src/media/service.ts \
            apps/api/src/media/operations-service.ts \
            apps/api/src/media/share-service.ts \
            apps/api/src/face/service.ts \
            apps/api/src/routes/face.ts \
            apps/api/src/routes/operations.ts \
            apps/api/src/routes/bib.ts \
            apps/api/src/routes/dashboard.ts \
            apps/api/src/app.ts \
            apps/web/src/components/gallery/bib-search-panel.tsx \
            apps/web/src/components/albums/album-settings.tsx
          git diff --check
      - name: Commit fixes and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/security-audit-fix.yml \
             .github/workflows/security-audit-fix-v2.yml \
             .github/workflows/security-audit-fix-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply security audit fixes"
          git push origin HEAD:fix/security-audit-20260915
