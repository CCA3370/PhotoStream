name: Adaptive upload finalizer

on:
  push:
    branches:
      - admin-workspace-refresh

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: admin-workspace-refresh
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply adaptive processing pool
        run: python3 .github/scripts/adaptive_upload_patch.py
      - name: Format and validate
        shell: bash
        run: |
          pnpm exec biome check --write apps/web/src/components/uploads/upload-queue.tsx
          pnpm lint
          pnpm typecheck
      - name: Commit adaptive pool
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/uploads/upload-queue.tsx
          git commit -m "Adapt upload processing concurrency to device capacity"
          git push origin HEAD:admin-workspace-refresh
