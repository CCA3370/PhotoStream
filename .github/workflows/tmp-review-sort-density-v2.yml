name: Temporary review sort and density integrator v2

on:
  push:
    branches:
      - review-workspace-efficiency

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: review-workspace-efficiency
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Integrate sorting and grid density
        run: |
          git show 289ae1bb2951890fb3d7d686e1fa9affe58d6a05:.github/workflows/tmp-review-sort-density.yml > /tmp/old.yml
          sed -n "/^          python3 - <<'PY'$/,/^          PY$/p" /tmp/old.yml | sed '1d;$d;s/^          //' > /tmp/integrate.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/integrate.py')
          text = p.read_text()
          text = text.replace('readonly sort: \\"newest\\" | \\"oldest\\";', 'readonly sort?: \\"newest\\" | \\"oldest\\";')
          text = text.replace('options.cursor, options.albumId, options.sort);', 'options.cursor, options.albumId, options.sort ?? \\"newest\\");')
          text = text.replace('options.sort === \\"oldest\\"', '(options.sort ?? \\"newest\\") === \\"oldest\\"')
          text = text.replace('last.id, options.sort)', 'last.id, options.sort ?? \\"newest\\")')
          p.write_text(text)
          PY
          python3 /tmp/integrate.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/review/review-workspace.tsx')
          text = path.read_text()
          block = '''function cursorSignature(cursor: RemoteCursor): string {\n  return cursor.kind === "single"\n    ? `single:${cursor.value}`\n    : `unpublished:${cursor.draft ?? "-"}:${cursor.pendingReview ?? "-"}`;\n}\n\n'''
          text = text.replace(block, '', 1)
          path.write_text(text)
          PY
          pnpm exec biome check --write apps/api/src/routes/photos.ts apps/api/src/media/service.ts apps/web/src/components/review/review-workspace.tsx
          pnpm typecheck
      - name: Commit integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/routes/photos.ts apps/api/src/media/service.ts apps/web/src/components/review/review-workspace.tsx
          git commit -m 'feat(review): add sorting and grid density'
          git push origin HEAD:review-workspace-efficiency
