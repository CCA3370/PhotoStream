name: Temporary featured review patcher

on:
  push:
    branches:
      - review-workspace-efficiency

permissions:
  contents: write

jobs:
  patch-featured:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: review-workspace-efficiency
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Patch featured filtering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              'apps/api/src/routes/photos.ts': [
                  (
                      '    publicationStatus: publicationStatusSchema.optional(),\n    ingestStatus: ingestStatusSchema.optional(),',
                      '    publicationStatus: publicationStatusSchema.optional(),\n    featured: z.enum(["true"]).optional(),\n    ingestStatus: ingestStatusSchema.optional(),',
                  ),
              ],
              'apps/api/src/media/service.ts': [
                  (
                      '''      readonly publicationStatus?:\n        | (typeof schema.publicationStatusEnum.enumValues)[number]\n        | undefined;\n      readonly ingestStatus?:''',
                      '''      readonly publicationStatus?:\n        | (typeof schema.publicationStatusEnum.enumValues)[number]\n        | undefined;\n      readonly featured?: "true" | undefined;\n      readonly ingestStatus?:''',
                  ),
                  (
                      '''    if (options.publicationStatus !== undefined) {\n      conditions.push(eq(schema.media.publicationStatus, options.publicationStatus));\n    }\n    if (options.ingestStatus !== undefined) {''',
                      '''    if (options.publicationStatus !== undefined) {\n      conditions.push(eq(schema.media.publicationStatus, options.publicationStatus));\n    }\n    if (options.featured === "true") {\n      conditions.push(\n        exists(\n          this.#database\n            .select({ value: sql`1` })\n            .from(schema.featuredMedia)\n            .where(eq(schema.featuredMedia.mediaId, schema.media.id)),\n        ),\n      );\n    }\n    if (options.ingestStatus !== undefined) {''',
                  ),
              ],
              'apps/web/src/components/review/review-workspace.tsx': [
                  (
                      '''      const query = buildRemoteQuery(publicationStatus, singleCursor);\n      const page = await clientGet<InternalMediaList>(''',
                      '''      const query = buildRemoteQuery(publicationStatus, singleCursor);\n      if (filter === "featured") query.set("featured", "true");\n      const page = await clientGet<InternalMediaList>(''',
                  ),
              ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected fragment missing in {filename}: {old[:160]}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          pnpm exec biome format --write apps/api/src/routes/photos.ts apps/api/src/media/service.ts apps/web/src/components/review/review-workspace.tsx
      - name: Commit featured filtering
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/routes/photos.ts apps/api/src/media/service.ts apps/web/src/components/review/review-workspace.tsx
          git commit -m 'feat(review): filter featured media server-side'
          git push origin HEAD:review-workspace-efficiency
