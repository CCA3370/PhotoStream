name: Biome autofix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biome-autofix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix known lint issues
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/components/dashboard/dashboard-view.tsx")
          source = path.read_text()
          source = source.replace(
              '''function stateCounts(albums: readonly AlbumSummaryView[]) {
            return albums.reduce<Record<AlbumSummaryView["state"], number>>(
              (counts, album) => ({ ...counts, [album.state]: counts[album.state] + 1 }),
              { draft: 0, live: 0, ended: 0, archived: 0 },
            );
          }''',
              '''function stateCounts(albums: readonly AlbumSummaryView[]) {
            const counts: Record<AlbumSummaryView["state"], number> = {
              draft: 0,
              live: 0,
              ended: 0,
              archived: 0,
            };
            for (const album of albums) counts[album.state] += 1;
            return counts;
          }''',
          )
          source = source.replace("async function usePreset(", "async function selectPreset(")
          source = source.replace("void usePreset(preset.key)", "void selectPreset(preset.key)")
          path.write_text(source)

      - name: Apply Biome safe fixes
        run: pnpm exec biome check --write . || true

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No autofixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply biome fixes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
